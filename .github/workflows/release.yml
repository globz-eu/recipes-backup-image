name: Build and Push Container Image

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  IMAGE: rg.fr-par.scw.cloud/recipes-images/recipes-backup

jobs:
  amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}

      - name: Smoke test
        run: ./scripts/smoke-test.sh "$IMAGE:$GITHUB_REF_NAME"

      # Reuses the layers of the build above.
      - name: Push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}

      - name: Write digest to the run summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "Digest: \`$IMAGE:$GITHUB_REF_NAME@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
