name: Build and Push Container Image

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  IMAGE: rg.fr-par.scw.cloud/recipes-images/recipes-backup

jobs:
  amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}

      - name: Smoke test
        run: ./scripts/smoke-test.sh "$IMAGE:$GITHUB_REF_NAME"

      # Reuses the layers of the build above.
      - name: Push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}

      - name: Write digest to the run summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "Digest: \`$IMAGE:$GITHUB_REF_NAME@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
