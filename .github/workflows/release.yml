name: Build and Push Container Image

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  IMAGE: rg.fr-par.scw.cloud/recipes-images/recipes-backup

jobs:
  amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}

      - name: Smoke test
        run: ./scripts/smoke-test.sh "$IMAGE:$GITHUB_REF_NAME"

      # Reuses the layers of the build above.
      - name: Push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}

      - name: Write digest to the run summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "Digest: \`$IMAGE:$GITHUB_REF_NAME@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
